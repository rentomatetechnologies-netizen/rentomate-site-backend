# RentOMate backend stack: PostgreSQL + API. The website runs separately and reaches the API via its BACKEND_URL.
# Usage (from this folder): cp .env.example .env, fill it in, then `docker compose up -d --build`.

name: rentomate-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rentomate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only the API container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentomate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rentomate}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
      # Where the website is, as seen from inside this container.
      FRONTEND_REVALIDATE_URL: ${DOCKER_FRONTEND_REVALIDATE_URL:-http://host.docker.internal:3000/api/revalidate}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOADS_DIR: /app/uploads
    volumes:
      # Uploaded images (blog/, hero/) are kept on the host, by default in the "uploads" folder next to this project.
      - ${UPLOADS_HOST_DIR:-../uploads}:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
